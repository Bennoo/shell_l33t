[project]
name = "l33t"
version = "0.11.1"
description = "Learn the shell by typing it: a terminal typing trainer built on real commands"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Optional: 37 extra terminal effects for the boot flourish.
# Install with:  uv sync --extra effects
effects = ["terminaltexteffects>=0.12"]

[project.scripts]
l33t = "l33t.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l33t"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
